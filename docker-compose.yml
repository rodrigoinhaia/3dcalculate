version: '3.8'

services:
  # 1. Banco de Dados PostgreSQL Otimizado (Alpine)
  postgres:
    image: postgres:16-alpine
    container_name: 3dcalc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-3dcalculate}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c max_connections=20
      -c effective_cache_size=128MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-3dcalculate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Ultra-Leve Fastify
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: 3dcalc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-3dcalculate}
      JWT_SECRET: ${JWT_SECRET:-3dcalc-super-secure-production-jwt-key-2026}
      NODE_ENV: production
    ports:
      - "3001:3001"

  # 3. Frontend Web SPA com Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 3dcalc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:3001
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
